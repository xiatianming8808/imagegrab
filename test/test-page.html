<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>测试商品页 · 图提取 ImageGrab</title>
  <style>
    body { font: 14px/1.6 "Microsoft YaHei", sans-serif; margin: 0; padding: 24px; background: #f6f8fb; }
    h1 { font-size: 18px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
    .item { background: #fff; border: 1px solid #e6eaf1; border-radius: 10px; padding: 10px; }
    img { max-width: 100%; display: block; border-radius: 6px; }
    .bg { height: 150px; border-radius: 8px; background-image: url("img/detail-800x600.png"); background-size: cover; }
    code { background: #eef2fb; padding: 1px 4px; border-radius: 4px; }
    .px { width: 1px; height: 1px; opacity: .02; }
  </style>
</head>
<body>
  <h1>模拟详情页（用于验证抓取逻辑）</h1>
  <p>包含：普通大图、懒加载（data-src）、背景图、srcset、1×1 埋点、logo 图标。</p>

  <div class="grid">
    <div class="item">
      <img id="normal" src="img/main-600x400.png" width="600" height="400" alt="普通大图" />
      <p>① 普通 &lt;img&gt; 600×400</p>
    </div>

    <div class="item">
      <img id="lazy" src="img/pixel-1x1.png" data-src="img/detail-1600x1200.png"
           width="600" height="400" alt="懒加载图" />
      <p>② data-src 懒加载 1600×1200</p>
    </div>

    <div class="item">
      <div class="bg"></div>
      <p>③ background-image 800×600</p>
    </div>

    <div class="item">
      <img id="srcset" src="img/detail-800x600.png"
           srcset="img/detail-800x600.png 800w, img/detail-1600x1200.png 1600w"
           width="400" height="300" alt="srcset" />
      <p>④ srcset 多尺寸</p>
    </div>

    <div class="item">
      <img id="pixel" class="px" src="img/pixel-1x1.png" alt="" />
      <p>⑤ 1×1 埋点（应过滤）</p>
    </div>

    <div class="item">
      <img id="logo" src="img/logo-32.png" alt="logo" />
      <p>⑥ logo 32×32（应过滤）</p>
    </div>
  </div>

  <p style="margin-top:18px;color:#7c8698">
    预期：保留 <code>main-600x400</code>、<code>detail-1600x1200</code>、<code>detail-800x600</code>；
    过滤 <code>pixel-1x1</code>、<code>logo-32</code>。把最小尺寸调到 1000 后应只剩 1600×1200 那几张。
  </p>
</body>
</html>
